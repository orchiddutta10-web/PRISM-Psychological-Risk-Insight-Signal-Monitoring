name: CI

on:
  push:
    branches: [ main, staging, dev ]
  pull_request:
    branches: [ main, staging ]

jobs:
  backend-lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3

      - name: Install Python Dependencies
        working-directory: services/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov black flake8

      - name: Run Code Formatter Checks (Black)
        working-directory: services/api
        run: black --check app

      - name: Run Linter (Flake8)
        working-directory: services/api
        run: |
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Backend Tests
        working-directory: services/api
        env:
          ENV: development
          # Development-only secrets. Production deployments must use real secrets
          # via environment variables; config.py refuses to start with these defaults
          # when ENV=production.
          JWT_SECRET: dev_jwt_secret_must_be_long_and_secure_key_here
          ENCRYPTION_KEY: u_S9vWJc9wD-G39eQv6L2eK5e9f8n7H8J9K0L1M2N3o=
          PYTHONPATH: .
        run: pytest app/tests -v --cov=app --cov-report=xml

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: apps/dashboard
        run: npm ci --no-audit --no-fund

      - name: Type Check
        working-directory: apps/dashboard
        run: npx tsc --noEmit

      - name: Build Dashboard
        working-directory: apps/dashboard
        run: npm run build

  docker-build:
    needs: backend-lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build API Docker Image
        run: docker build -f infra/Dockerfile.api -t prism-api:staging .

  playwright-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: apps/dashboard
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Browsers
        working-directory: apps/dashboard
        run: npx playwright install --with-deps

      - name: Build Dashboard for E2E
        working-directory: apps/dashboard
        run: npm run build

      - name: Run Playwright tests
        working-directory: apps/dashboard
        run: npx playwright test

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/dashboard/playwright-report/
          retention-days: 30
