<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <rect width="100" height="100" fill="#FFFFFF" />
  <!-- Outer refracting prism shape -->
  <polygon points="50,15 15,80 85,80" stroke="#111111" stroke-width="3" fill="none" />
  
  <!-- Internal refract lines representing telemetry streams -->
  <line x1="50" y1="15" x2="50" y2="80" stroke="#666666" stroke-width="1.5" stroke-dasharray="2 2" />
  <line x1="50" y1="45" x2="25" y2="70" stroke="#BFAE98" stroke-width="2" />
  <line x1="50" y1="45" x2="75" y2="70" stroke="#6B6B6B" stroke-width="1.5" />
  
  <!-- Base anchor nodes -->
  <circle cx="50" cy="15" r="4" fill="#FFFFFF" stroke="#111111" stroke-width="2" />
  <circle cx="15" cy="80" r="4" fill="#FFFFFF" stroke="#111111" stroke-width="2" />
  <circle cx="85" cy="80" r="4" fill="#FFFFFF" stroke="#111111" stroke-width="2" />
</svg>
